<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cyber Bodyguard - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d3d 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 2px solid #00d4ff;
        }

        h1 {
            font-size: 2.5em;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .subtitle {
            color: #888;
            font-size: 0.9em;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #00d4ff;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.95em;
        }

        .search-box::placeholder {
            color: #666;
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        select {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #00d4ff;
            border-radius: 4px;
            color: #e0e0e0;
            cursor: pointer;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #00d4ff;
            color: #1e1e2e;
        }

        .btn-primary:hover {
            background: #00b3cc;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid #00d4ff;
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .card-label {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00d4ff;
        }

        .critical { color: #ff0000; border-color: #ff0000; }
        .critical .card-value { color: #ff0000; }

        .high { color: #ff9800; border-color: #ff9800; }
        .high .card-value { color: #ff9800; }

        .medium { color: #ffeb3b; border-color: #ffeb3b; }
        .medium .card-value { color: #ffeb3b; }

        .alerts-section {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #00d4ff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #00d4ff;
        }

        .alert-item {
            background: rgba(0, 0, 0, 0.2);
            border-left: 4px solid #00d4ff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .alert-item:hover {
            background: rgba(0, 0, 0, 0.4);
            transform: translateX(5px);
        }

        .alert-item.critical {
            border-left-color: #ff0000;
            background: rgba(255, 0, 0, 0.1);
        }

        .alert-item.high {
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }

        .alert-item.medium {
            border-left-color: #ffeb3b;
            background: rgba(255, 235, 59, 0.1);
        }

        .alert-item.info {
            border-left-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .alert-severity {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .severity-critical {
            background: rgba(255, 0, 0, 0.3);
            color: #ff0000;
        }

        .severity-high {
            background: rgba(255, 152, 0, 0.3);
            color: #ff9800;
        }

        .severity-medium {
            background: rgba(255, 235, 59, 0.3);
            color: #ffeb3b;
        }

        .severity-info {
            background: rgba(0, 255, 0, 0.3);
            color: #00ff00;
        }

        .alert-time {
            color: #888;
            font-size: 0.85em;
        }

        .threats-list {
            list-style: none;
            margin-top: 10px;
            padding-left: 20px;
        }

        .threats-list li {
            color: #ccc;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .threats-list li:before {
            content: "● ";
            color: #00d4ff;
            margin-right: 8px;
        }

        .web-alert-content {
            margin-top: 10px;
        }

        .web-url {
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 8px;
            border-radius: 3px;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .web-status {
            margin-bottom: 8px;
            font-weight: bold;
        }

        .web-details {
            color: #ccc;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 40px;
        }

        .spinner {
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-alerts {
            text-align: center;
            color: #888;
            padding: 40px;
            font-size: 1.1em;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid #444;
            margin-top: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stats-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
        }

        .stat-title {
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ AI CYBER BODYGUARD DASHBOARD</h1>
            <p class="subtitle">Real-time Threat Monitoring & Analysis</p>
        </header>

        <div class="summary-grid">
            <div class="summary-card">
                <div class="card-label">Total Alerts</div>
                <div class="card-value" id="total-alerts">-</div>
            </div>

            <div class="summary-card critical">
                <div class="card-label">🚨 Critical</div>
                <div class="card-value" id="critical-alerts">-</div>
            </div>

            <div class="summary-card high">
                <div class="card-label">⚠️ High Risk</div>
                <div class="card-value" id="high-alerts">-</div>
            </div>

            <div class="summary-card medium">
                <div class="card-label">⚡ Medium</div>
                <div class="card-value" id="medium-alerts">-</div>
            </div>

            <div class="summary-card" style="border-color: #00ff00; color: #00ff00;">
                <div class="card-label">✅ Safe URLs</div>
                <div class="card-value" id="safe-alerts" style="color: #00ff00;">-</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search threats..." />
            
            <div class="filter-group">
                <select id="severityFilter">
                    <option value="all">All Severities</option>
                    <option value="critical">🚨 Critical</option>
                    <option value="high">⚠️ High</option>
                    <option value="medium">⚡ Medium</option>
                    <option value="info">✅ Safe</option>
                </select>

                <select id="hoursFilter">
                    <option value="1">Last Hour</option>
                    <option value="6">Last 6 Hours</option>
                    <option value="24" selected>Last 24 Hours</option>
                    <option value="168">Last Week</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="loadAlerts()">🔄 Refresh</button>
            <button class="btn btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
        </div>

        <div class="alerts-section">
            <h2 class="section-title">Latest Alerts</h2>
            <div id="alerts-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading alerts...</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Last Updated: <span id="lastUpdate">--:--:--</span> | Auto-refresh every 5 seconds | Clipboard monitoring every 10 seconds</p>
        </div>
    </div>

    <script>
        function formatTime(timeStr) {
            if (!timeStr) return 'N/A';
            return timeStr.slice(0, 19);
        }

        function updateLastUpdate() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString();
        }

        function loadSummary() {
            fetch('/api/summary')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('total-alerts').textContent = data.total;
                    document.getElementById('critical-alerts').textContent = data.critical;
                    document.getElementById('high-alerts').textContent = data.high;
                    document.getElementById('medium-alerts').textContent = data.medium;
                    document.getElementById('safe-alerts').textContent = data.safe || 0;
                });
        }

        function loadAlerts() {
            const severity = document.getElementById('severityFilter').value;
            const hours = document.getElementById('hoursFilter').value;
            
            const url = `/api/alerts?severity=${severity}&hours=${hours}&limit=100`;
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    renderAlerts(data.alerts);
                    updateLastUpdate();
                });
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alerts-container');
            
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '<div class="no-alerts">✅ No threats detected</div>';
                return;
            }

            container.innerHTML = '';
            alerts.forEach(alert => {
                const severity = alert.severity.toLowerCase();
                const threatsList = (alert.threats || [])
                    .map(t => `<li>${t}</li>`)
                    .join('');

                // Display URL if present
                const urlContent = alert.url ? `
                    <div class="web-alert-content">
                        <div class="web-url">🔗 ${alert.url}</div>
                        <div class="web-status">
                            Status: <strong>${alert.data?.status || (alert.malicious ? 'MALICIOUS' : 'SAFE')}</strong>
                        </div>
                        <div class="web-details">
                            <strong>Reason:</strong> ${alert.reason || 'N/A'}<br>
                            <strong>Details:</strong> ${alert.details || alert.data?.details || 'N/A'}
                        </div>
                    </div>
                ` : '';

                const html = `
                    <div class="alert-item ${severity}">
                        <div class="alert-header">
                            <span class="alert-severity severity-${severity}">
                                ${alert.severity}
                            </span>
                            <span class="alert-time">${formatTime(alert.data?.time)}</span>
                        </div>
                        <ul class="threats-list">
                            ${threatsList || '<li>No specific threats logged</li>'}
                        </ul>
                        ${urlContent}
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function searchAlerts() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                loadAlerts();
                return;
            }

            fetch(`/api/search?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    renderAlerts(data.alerts);
                });
        }

        function exportCSV() {
            const severity = document.getElementById('severityFilter').value;
            const url = `/api/export/csv?severity=${severity}`;
            
            // Create download link
            const link = document.createElement('a');
            link.href = url;
            link.download = `threats_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('keyup', searchAlerts);
        document.getElementById('severityFilter').addEventListener('change', loadAlerts);
        document.getElementById('hoursFilter').addEventListener('change', loadAlerts);

        // Initial load
        loadSummary();
        loadAlerts();
        updateLastUpdate();

        // Auto-refresh every 5 seconds
        setInterval(() => {
            loadSummary();
            loadAlerts();
            updateLastUpdate();
        }, 5000);
    </script>
</body>
</html>
